name: bgt_manejo_de_fondos
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  mocktail: ^1.0.4

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/btgLogo1024_1024.png
  android: true
  ios: true
  web: true
  
  fullscreen: true

  android_12:
    image: assets/btgLogoMobile.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    android_gravity: fill

flutter:
  uses-material-design: true
  assets:
    - assets/
